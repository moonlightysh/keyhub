{% extends "base.html" %}
{% block title %}邀请码验证 - KeyHub{% endblock %}
{% block content %}

<section class="hero">
  <h1>🔐 KeyHub</h1>
  <p class="lead">请输入邀请码以继续访问</p>
</section>

<section class="card" style="max-width: 420px; margin: 0 auto;">
  <form method="POST" action="{{ url_for('gate') }}">
    <div class="field">
      <label for="invite_code">邀请码</label>
      <input type="text" id="invite_code" name="invite_code"
             required autofocus placeholder="输入管理员提供的邀请码"
             style="text-align: center; font-size: 18px; letter-spacing: 2px;">
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary" style="width: 100%;">验证</button>
    </div>
  </form>
</section>

{% endblock %}
