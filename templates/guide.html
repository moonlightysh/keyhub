{% extends "base.html" %}
{% block title %}用户指南 - KeyHub{% endblock %}
{% block content %}

<section class="hero">
  <h1>📖 用户指南</h1>
  <p class="lead">KeyHub 使用说明，涵盖密钥生成、公钥上传、发送加密消息与解密。</p>
</section>

<section class="card guide-content">
  {{ guide_html|safe }}
</section>

<style>
  /* Markdown 内容样式 */
  .guide-content h1 { display: none; }  /* 隐藏文档大标题，由页面 hero 展示 */
  .guide-content h2 {
    font-size: 22px;
    margin-top: 28px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .guide-content h2:first-child { margin-top: 0; }
  .guide-content h3 {
    font-size: 17px;
    margin-top: 22px;
  }
  .guide-content p { margin: 12px 0; }
  .guide-content ul, .guide-content ol {
    padding-left: 24px;
    margin: 12px 0;
  }
  .guide-content li { margin: 6px 0; }
  .guide-content blockquote {
    margin: 14px 0;
    padding: 8px 16px;
    background: #f6f8fa;
    border-left: 4px solid var(--primary);
    color: var(--muted);
    border-radius: 0 6px 6px 0;
  }
  .guide-content blockquote p { margin: 4px 0; }
  .guide-content pre {
    background: #f6f8fa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    line-height: 1.5;
  }
  .guide-content pre code {
    background: none;
    padding: 0;
    font-size: 13px;
  }
  .guide-content table {
    border-collapse: collapse;
    margin: 14px 0;
    width: 100%;
  }
  .guide-content th, .guide-content td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .guide-content th { background: #f6f8fa; font-weight: 600; }
  .guide-content strong { font-weight: 600; }
</style>

{% endblock %}
