services:
  keyhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: keyhub:latest
    container_name: keyhub
    restart: unless-stopped
    ports:
      # 只绑定到 localhost，避免本机以外的设备能直接访问
      # macOS AirPlay Receiver 占用了 5000，改用 5001
      - "127.0.0.1:5001:5000"
    volumes:
      # 用户注册的公钥 JSON 持久化到宿主机 ./data
      - ./data:/app/data
    environment:
      # Flask 秘钥（生产环境请改成 openssl rand -hex 32 生成的字符串）
      - FLASK_SECRET_KEY=change-this-to-a-long-random-string
      - FLASK_DEBUG=false
      # ====== 阿里云 OSS 备份（留空则跳过备份） ======
      # 填好后可在容器内手动执行 python backup_oss.py 测试
      # 或在宿主机 crontab 中定时调用
      - OSS_ACCESS_KEY_ID=
      - OSS_ACCESS_KEY_SECRET=
      - OSS_ENDPOINT=
      - OSS_BUCKET=
      - OSS_PREFIX=keyhub-backup/
    healthcheck:
      test: ["CMD", "python", "-c",
              "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
